<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Consulting Platform</title>
    <style>
      /* Hide Kimi Agent widget */
      [class*="kimi"],
      [id*="kimi"],
      [class*="Kimi"],
      [id*="Kimi"],
      div[data-testid*="kimi"],
      div[role="button"][class*="kimi"],
      /* Common widget selectors */
      .floating-widget,
      .chat-widget,
      .ai-agent,
      [class*="agent"][class*="floating"],
      /* Specific patterns */
      div[style*="position: fixed"][style*="z-index: 9999"],
      iframe[src*="kimi"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CbZGNv-z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-EnfRpBSC.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Remove Kimi Agent widget on load
      (function() {
        function removeKimiWidget() {
          const selectors = [
            '[class*="kimi"]',
            '[id*="kimi"]',
            '[class*="Kimi"]',
            '[id*="Kimi"]',
            '.floating-widget',
            '.chat-widget'
          ];
          selectors.forEach(selector => {
            document.querySelectorAll(selector).forEach(el => {
              if (el.textContent?.includes('Kimi') || el.className?.includes('kimi')) {
                el.remove();
              }
            });
          });
        }
        // Run immediately and periodically
        removeKimiWidget();
        setInterval(removeKimiWidget, 500);
        // Also run after DOM changes
        new MutationObserver(removeKimiWidget).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
